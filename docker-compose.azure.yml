  services:
    postgres:
      ports: !reset [ ]

    redis:
      ports: !reset [ ]

    rabbitmq:
      ports: !reset [ ]
      environment:
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configurar RABBITMQ_PASSWORD}

    lastmileuy.api:
      ports:
        - "127.0.0.1:8080:8080"
      environment:
        ASPNETCORE_ENVIRONMENT: Production
        Avisos__PermitirDestinosLocales: "false"

    lastmileuy.backoffice:
      ports:
        - "127.0.0.1:8081:8080"

    lastmileuy.commerceportal:
      ports:
        - "127.0.0.1:8082:8080"

    lastmileuy.driverpwa:
      ports:
        - "127.0.0.1:8083:80"

    lastmileuy.publictracking:
      ports:
        - "127.0.0.1:8084:8080"

    lastmileuy.worker:
      environment:
        DOTNET_ENVIRONMENT: Production
        Avisos__PermitirDestinosLocales: "false"

    grafana:
      environment:
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Configurar GRAFANA_ADMIN_PASSWORD}
