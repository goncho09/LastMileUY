  services:
    postgres:
      ports: !reset [ ]
      restart: unless-stopped

    redis:
      ports: !reset [ ]
      restart: unless-stopped
    
    rabbitmq:
      ports: !reset [ ]
      environment:
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configurar RABBITMQ_PASSWORD}
      restart: unless-stopped
    
    lastmileuy.api:
      ports: !override
        - "127.0.0.1:8080:8080"
      environment:
        # Los pedidos llegan por el proxy de la máquina, a través de la red de Docker: se confía en su
        # X-Forwarded-For para ver la IP real del visitante (src/Compartido/ProxyInverso.cs)
        ProxyInverso__RedesConfiables__0: "172.16.0.0/12"
        ASPNETCORE_ENVIRONMENT: Production
        Avisos__PermitirDestinosLocales: "false"
        SeedAdmin__Enabled: "false"
        BaseDeDatos__AplicarMigraciones: "false"
      restart: unless-stopped

    lastmileuy.backoffice:
      ports: !override
        - "127.0.0.1:8081:8080"
      environment:
        ProxyInverso__RedesConfiables__0: "172.16.0.0/12"
        ASPNETCORE_ENVIRONMENT: Production
      volumes: !override
        - claves_backoffice:/claves
      restart: unless-stopped
    
    lastmileuy.commerceportal:
      ports: !override
        - "127.0.0.1:8082:8080"
      environment:
        ProxyInverso__RedesConfiables__0: "172.16.0.0/12"
      restart: unless-stopped
    
    lastmileuy.driverpwa:
      ports: !override
         - "127.0.0.1:8083:80"
      restart: unless-stopped
    
    lastmileuy.publictracking:
      ports: !override
        - "127.0.0.1:8084:8080"
      environment:
        ProxyInverso__RedesConfiables__0: "172.16.0.0/12"
      restart: unless-stopped
    
    lastmileuy.worker:
      environment:
        DOTNET_ENVIRONMENT: Production
        Avisos__PermitirDestinosLocales: "false"
      restart: unless-stopped
    
    grafana:
      environment:
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Configurar GRAFANA_ADMIN_PASSWORD}
      restart: unless-stopped
    
    lastmileuy.receptoravisos:
      environment:
        ASPNETCORE_ENVIRONMENT: Production
      restart: unless-stopped
