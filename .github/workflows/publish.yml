
name: Publicar imagenes Docker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-lastmileuy
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: api
            dockerfile: src/LastMileUY.API/Dockerfile
          - servicio: backoffice
            dockerfile: src/LastMileUY.Backoffice/Dockerfile
          - servicio: commerceportal
            dockerfile: src/LastMileUY.CommercePortal/Dockerfile
          - servicio: driverpwa
            dockerfile: src/LastMileUY.DriverPWA/Dockerfile
          - servicio: publictracking
            dockerfile: src/LastMileUY.PublicTracking/Dockerfile
          - servicio: worker
            dockerfile: src/LastMileUY.Worker/Dockerfile
          - servicio: receptoravisos
            dockerfile: src/LastMileUY.ReceptorAvisos/Dockerfile

    steps:
      - name: Descargar version validada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar nombre de imagen
        id: imagen
        env:
          REPOSITORIO: ${{ github.repository }}
        run: |
          echo "base=ghcr.io/${REPOSITORIO,,}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.imagen.outputs.base }}-${{ matrix.servicio }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  registrar-version:
    name: Registrar version validada
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el commit sigue siendo main
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          ACTUAL=$(gh api "repos/$REPOSITORIO/commits/main" --jq '.sha')

          if [ "$ACTUAL" != "$COMMIT" ]; then
            echo "::error::El commit validado ya no es el HEAD de main."
            exit 1
          fi
      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar indicador de version
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          REPOSITORIO="${REPOSITORIO,,}"
          printf '%s\n' "$COMMIT" > version.txt
          printf 'FROM scratch\nCOPY version.txt /version.txt\n' > Dockerfile.release

          docker build \
            -f Dockerfile.release \
            -t "ghcr.io/$REPOSITORIO-release:stable" .

          docker push "ghcr.io/$REPOSITORIO-release:stable"

      - name: Resumen
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "## Version lista para desplegar" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagenes publicadas: 7/7" >> "$GITHUB_STEP_SUMMARY"
          echo "Indicador de version: publicado" >> "$GITHUB_STEP_SUMMARY"
