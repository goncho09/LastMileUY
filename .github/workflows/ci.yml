name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: |
          dotnet restore LastMileUY.slnx
          dotnet tool restore

      - name: Compilar
        run: dotnet build LastMileUY.slnx --no-restore --configuration Release

      # El CSS de Tailwind va generado en el repositorio: si alguien usa una clase nueva y no lo vuelve a
      # generar, la clase no existe y la pantalla se ve mal sin ningún error. Se genera de nuevo y tiene
      # que dar lo mismo que lo que está subido
      - name: CSS de Tailwind al día
        run: |
          for app in Backoffice:wwwroot/css/tailwind.css CommercePortal:wwwroot/tailwind.css DriverPWA:wwwroot/css/tailwind.css; do
            proyecto="src/LastMileUY.${app%%:*}"
            (cd "$proyecto" && npm ci --silent && npx @tailwindcss/cli -i Styles/input.css -o "${app#*:}")
          done
          git diff --exit-code --stat -- 'src/*/wwwroot/*tailwind.css' \
            || { echo "::error::Falta regenerar el CSS de Tailwind (ver la sección Estilos del README)"; exit 1; }

      # Las pruebas de navegador (tests/LastMileUY.E2E.Tests) usan Chromium con Playwright: se instala
      # con las bibliotecas del sistema que necesita (pwsh ya viene en el runner)
      - name: Navegador para las pruebas
        run: pwsh tests/LastMileUY.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Las pruebas de aislamiento levantan PostgreSQL con Testcontainers (Docker ya viene en el runner)
      - name: Pruebas (con cobertura)
        run: >
          dotnet test LastMileUY.slnx --no-build --configuration Release --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory cobertura

      # Resumen de cobertura en la página de la ejecución (sin contar pruebas ni migraciones generadas)
      - name: Reporte de cobertura
        if: always()
        run: |
          dotnet reportgenerator \
            -reports:"cobertura/**/coverage.cobertura.xml" \
            -targetdir:cobertura/reporte \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"-*.Tests" \
            -classfilters:"-LastMileUY.API.Infrastructure.Persistence.Migrations.*"
          cat cobertura/reporte/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el reporte completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: cobertura/reporte
