name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore LastMileUY.slnx

      - name: Compilar
        run: dotnet build LastMileUY.slnx --no-restore --configuration Release

      - name: Pruebas
        run: dotnet test LastMileUY.slnx --no-build --configuration Release --verbosity normal
