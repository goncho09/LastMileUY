server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Encabezados de seguridad (ver docs/seguridad.md): sin la versión de nginx, el navegador no
    # adivina el tipo de contenido, la app no se deja meter en un iframe ajeno y a otros sitios no
    # les llega la dirección de la página. "always": también en los errores.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://lastmileuy.api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # La API ya lo manda y nginx lo agrega: sin esto llegaría repetido
        proxy_hide_header X-Content-Type-Options;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
