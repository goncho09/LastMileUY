server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Encabezados de seguridad (ver docs/seguridad.md): sin la versión de nginx, el navegador no
    # adivina el tipo de contenido, la app no se deja meter en un iframe ajeno y a otros sitios no
    # les llega la dirección de la página. "always": también en los errores.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # La dirección de la API se busca en el DNS de Docker cada 10 segundos. Con un nombre fijo en
    # proxy_pass, nginx la resuelve una sola vez al arrancar: si después el contenedor de la API se
    # reinicia y cambia de IP, nginx le seguía mandando los pedidos a la vieja (a otro contenedor,
    # que contestaba 404) y la app quedaba sin API hasta reiniciar este contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://lastmileuy.api:8080;

    location /api/ {
        # Con una variable y sin ruta, nginx pasa la dirección pedida tal cual (/api/...)
        proxy_pass $api;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # La API ya lo manda y nginx lo agrega: sin esto llegaría repetido
        proxy_hide_header X-Content-Type-Options;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
