services:
  postgres:
    image: postgres:17
    container_name: lastmileuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lastmileuy
      POSTGRES_USER: lastmileuy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmileuy -d lastmileuy"]
      interval: 5s
      timeout: 5s
      retries: 5

  lastmileuy.api:
    image: lastmileuy.api
    build:
      context: .
      dockerfile: src/LastMileUY.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      # La app usa lastmileuy_app (sin privilegios) para que le aplique el RLS (ADR-01).
      # Ese rol y su contraseña de desarrollo los crea la migración AislamientoPorOperadorRls.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lastmileuy;Username=lastmileuy_app;Password=lastmileuy_app_dev"
      # El dueño de las tablas solo se usa para aplicar las migraciones al arrancar
      ConnectionStrings__Migraciones: "Host=postgres;Port=5432;Database=lastmileuy;Username=lastmileuy;Password=${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}"
      BaseDeDatos__AplicarMigraciones: "true"
      SeedAdmin__Email: ${SeedAdmin__Email:?Configurar SeedAdmin__Email}
      SeedAdmin__Password: ${SeedAdmin__Password:?Configurar SeedAdmin__Password}
      SeedOperadorPrueba__Email: ${SeedOperadorPrueba__Email:?Configurar SeedOperadorPrueba__Email}
      SeedOperadorPrueba__Password: ${SeedOperadorPrueba__Password:?Configurar SeedOperadorPrueba__Password}
      SeedComercioPrueba__Email: ${SeedComercioPrueba__Email:?Configurar SeedComercioPrueba__Email}
      SeedComercioPrueba__Password: ${SeedComercioPrueba__Password:?Configurar SeedComercioPrueba__Password}
      # Claves de las cookies de sesión en un volumen: las sesiones sobreviven a recrear el contenedor
      DataProtection__Directorio: /claves
    volumes:
      - claves_api:/claves
    depends_on:
      postgres:
        condition: service_healthy

  lastmileuy.backoffice:
    image: lastmileuy.backoffice
    build:
      context: .
      dockerfile: src/LastMileUY.Backoffice/Dockerfile
    ports:
      - "8081:8080"
    environment:
      # Usa la API real (no los datos de prueba); el login es contra la API
      Api__UsarDatosDePrueba: "false"
      Api__UrlBase: "http://lastmileuy.api:8080/"
      DataProtection__Directorio: /claves
    volumes:
      - claves_backoffice:/claves
    depends_on:
      - lastmileuy.api

  lastmileuy.commerceportal:
    image: lastmileuy.commerceportal
    build:
      context: .
      dockerfile: src/LastMileUY.CommercePortal/Dockerfile
    ports:
      - "8082:8080"
    environment:
      # El portal del comercio habla con la API real; el login es contra la API
      Api__UrlBase: "http://lastmileuy.api:8080/"
      DataProtection__Directorio: /claves
    volumes:
      - claves_portal:/claves
    depends_on:
      - lastmileuy.api

  lastmileuy.driverpwa:
    image: lastmileuy.driverpwa
    build:
      context: .
      dockerfile: src/LastMileUY.DriverPWA/Dockerfile

  lastmileuy.publictracking:
    image: lastmileuy.publictracking
    build:
      context: .
      dockerfile: src/LastMileUY.PublicTracking/Dockerfile

  lastmileuy.worker:
    image: lastmileuy.worker
    build:
      context: .
      dockerfile: src/LastMileUY.Worker/Dockerfile

volumes:
  postgres_data:
  claves_api:
  claves_backoffice:
  claves_portal:
