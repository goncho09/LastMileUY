services:
  postgres:
    image: postgres:17
    container_name: lastmileuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lastmileuy
      POSTGRES_USER: lastmileuy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmileuy -d lastmileuy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Caché distribuido (compartido entre instancias de la API)
  redis:
    image: redis:7.4-alpine
    container_name: lastmileuy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mensajería: la API publica los eventos de envío y el worker los consume (docs/mensajeria.md).
  # Panel de administración en http://localhost:15672 (mismo usuario y contraseña).
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: lastmileuy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lastmileuy
      # Contraseña de desarrollo por defecto; en otro ambiente se configura RABBITMQ_PASSWORD
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lastmileuy_rabbit_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6

  lastmileuy.api:
    image: lastmileuy.api
    build:
      context: .
      dockerfile: src/LastMileUY.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      # La app usa lastmileuy_app (sin privilegios) para que le aplique el RLS (ADR-01).
      # Ese rol y su contraseña de desarrollo los crea la migración AislamientoPorOperadorRls.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lastmileuy;Username=lastmileuy_app;Password=lastmileuy_app_dev"
      # El dueño de las tablas solo se usa para aplicar las migraciones al arrancar
      ConnectionStrings__Migraciones: "Host=postgres;Port=5432;Database=lastmileuy;Username=lastmileuy;Password=${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD}"
      BaseDeDatos__AplicarMigraciones: "true"
      SeedAdmin__Email: ${SeedAdmin__Email:?Configurar SeedAdmin__Email}
      SeedAdmin__Password: ${SeedAdmin__Password:?Configurar SeedAdmin__Password}
      SeedOperadorPrueba__Email: ${SeedOperadorPrueba__Email:?Configurar SeedOperadorPrueba__Email}
      SeedOperadorPrueba__Password: ${SeedOperadorPrueba__Password:?Configurar SeedOperadorPrueba__Password}
      SeedComercioPrueba__Email: ${SeedComercioPrueba__Email:?Configurar SeedComercioPrueba__Email}
      SeedComercioPrueba__Password: ${SeedComercioPrueba__Password:?Configurar SeedComercioPrueba__Password}
      # Claves de las cookies de sesión en un volumen: las sesiones sobreviven a recrear el contenedor
      DataProtection__Directorio: /claves
      # Firmas y fotos de las entregas que manda la app del repartidor
      Evidencias__Directorio: /evidencias
      # Caché distribuido: Redis del compose
      ConnectionStrings__Redis: "redis:6379"
      # Deja suscribir avisos al receptor de prueba (http y dirección interna), igual que el worker.
      # En producción va en false
      Avisos__PermitirDestinosLocales: "true"
      # Eventos de envío: el publicador del outbox los manda a RabbitMQ.
      # Lee el outbox con su propio usuario (lo crea la migración Outbox, igual que lastmileuy_app)
      ConnectionStrings__RabbitMQ: "amqp://lastmileuy:${RABBITMQ_PASSWORD:-lastmileuy_rabbit_dev}@rabbitmq:5672/"
      ConnectionStrings__Outbox: "Host=postgres;Port=5432;Database=lastmileuy;Username=lastmileuy_publicador;Password=lastmileuy_publicador_dev"
    volumes:
      - claves_api:/claves
      - evidencias_api:/evidencias
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  lastmileuy.backoffice:
    image: lastmileuy.backoffice
    build:
      context: .
      dockerfile: src/LastMileUY.Backoffice/Dockerfile
    ports:
      - "8081:8080"
    environment:
      # Usa la API real (no los datos de prueba); el login es contra la API
      Api__UsarDatosDePrueba: "false"
      Api__UrlBase: "http://lastmileuy.api:8080/"
      DataProtection__Directorio: /claves
      ConnectionStrings__RabbitMQ: "amqp://lastmileuy:${RABBITMQ_PASSWORD:-lastmileuy_rabbit_dev}@rabbitmq:5672/"
    volumes:
      - claves_backoffice:/claves
      - type: bind
        source: ./src/LastMileUY.Backoffice/wwwroot/css/site.css
        target: /app/wwwroot/css/site.css
        read_only: true
        bind:
          create_host_path: false
      
    depends_on:
      lastmileuy.api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  lastmileuy.commerceportal:
    image: lastmileuy.commerceportal
    build:
      context: .
      dockerfile: src/LastMileUY.CommercePortal/Dockerfile
    ports:
      - "8082:8080"
    environment:
      # El portal del comercio habla con la API real; el login es contra la API
      Api__UrlBase: "http://lastmileuy.api:8080/"
      DataProtection__Directorio: /claves
    volumes:
      - claves_portal:/claves
    depends_on:
      - lastmileuy.api

  lastmileuy.driverpwa:
    image: lastmileuy.driverpwa
    build:
      context: .
      dockerfile: src/LastMileUY.DriverPWA/Dockerfile
    ports:
        - "8083:80"
    # nginx necesita que exista el contenedor de la API al arrancar (hace de proxy hacia ella)
    depends_on:
      - lastmileuy.api

  lastmileuy.publictracking:
    image: lastmileuy.publictracking
    build:
      context: .
      dockerfile: src/LastMileUY.PublicTracking/Dockerfile
    ports:
      - "8084:8080"
    environment:
      # Página pública: le consulta a la API desde el servidor, sin sesión
      Api__UrlBase: "http://lastmileuy.api:8080/"
    depends_on:
      - lastmileuy.api

  lastmileuy.worker:
    image: lastmileuy.worker
    build:
      context: .
      dockerfile: src/LastMileUY.Worker/Dockerfile
    environment:
      ConnectionStrings__RabbitMQ: "amqp://lastmileuy:${RABBITMQ_PASSWORD:-lastmileuy_rabbit_dev}@rabbitmq:5672/"
      # Mismo usuario que la API (lastmileuy_app): le aplica el RLS del ADR-01
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lastmileuy;Username=lastmileuy_app;Password=lastmileuy_app_dev"
      # Deja mandar avisos por http a direcciones internas, como el receptor de prueba
      # (http://lastmileuy.receptoravisos:8080/avisos). En producción va en false
      Avisos__PermitirDestinosLocales: "true"
    depends_on:
      rabbitmq:
        condition: service_healthy
      # La API aplica las migraciones al arrancar (crea las tablas que usa el worker)
      lastmileuy.api:
        condition: service_started

  # Hace de comercio para probar los avisos: GET http://localhost:8085/avisos muestra lo recibido
  lastmileuy.receptoravisos:
    image: lastmileuy.receptoravisos
    build:
      context: .
      dockerfile: src/LastMileUY.ReceptorAvisos/Dockerfile
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Avisos__RutaClaves: /app/data/claves-avisos.json
    volumes:
      - receptor_avisos_data:/app/data

volumes:
  postgres_data:
  rabbitmq_data:
  claves_api:
  evidencias_api:
  claves_backoffice:
  claves_portal:
  receptor_avisos_data:
