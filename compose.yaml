services:
  postgres:
    image: postgres:17
    container_name: lastmileuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lastmileuy
      POSTGRES_USER: lastmileuy
      POSTGRES_PASSWORD: lastmileuy_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmileuy -d lastmileuy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: