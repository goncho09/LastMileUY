
services:
  lastmileuy.api:
    environment:
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/lastmileuy-api.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${LASTMILE_HTTPS_PASSWORD}

    volumes:
      - "${USERPROFILE}/.aspnet/https:/https:ro"

    ports: !override
      - "8080:8080"
      - "8443:8443"

  lastmileuy.backoffice:
    build:
      context: .
      dockerfile: src/LastMileUY.Backoffice/Dockerfile.dev

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

    volumes:
      - ./src/LastMileUY.Backoffice:/workspace/src/LastMileUY.Backoffice
      - ./src/LastMileUY.Contracts:/workspace/src/LastMileUY.Contracts
      - type: volume
        source: backoffice_obj
        target: /workspace/src/LastMileUY.Backoffice/obj
      - type: volume
        source: backoffice_bin
        target: /workspace/src/LastMileUY.Backoffice/bin

    entrypoint:
      - dotnet
      - watch
      - run
      - --no-launch-profile
      - --urls
      - http://0.0.0.0:8080

  lastmileuy.driverpwa:
    build:
      context: .
      dockerfile: src/LastMileUY.DriverPWA/Dockerfile.dev

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"

    entrypoint:
      - dotnet
      - watch
      - run
      - --no-launch-profile
      - --non-interactive
      - --urls
      - http://0.0.0.0:8080

    volumes:
      - ./src/LastMileUY.DriverPWA:/workspace/src/LastMileUY.DriverPWA
      - ./src/LastMileUY.Contracts:/workspace/src/LastMileUY.Contracts
      - type: volume
        source: driverpwa_obj
        target: /workspace/src/LastMileUY.DriverPWA/obj
      - type: volume
        source: driverpwa_bin
        target: /workspace/src/LastMileUY.DriverPWA/bin

    ports: !override
      - "8083:8080"

volumes:
  backoffice_obj:
  backoffice_bin:
  driverpwa_obj:
  driverpwa_bin:
