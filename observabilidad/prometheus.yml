global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # RabbitMQ (plugin rabbitmq_prometheus): mensajes en cada cola, para la profundidad de la cola
  # del worker y de la de fallidos en el tablero técnico
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
